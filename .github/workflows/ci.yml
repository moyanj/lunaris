name: CI

on:
  push:
    branches: [main]
    paths:
      - "lunaris/**"
      - "rust-worker/**"
      - "proto/**"
      - "tests/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "lunaris/**"
      - "rust-worker/**"
      - "proto/**"
      - "tests/**"
      - "pyproject.toml"
      - "Cargo.toml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run pytest

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-worker
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-worker
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo check

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    needs: rust-check
    defaults:
      run:
        working-directory: rust-worker
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-worker
      - run: cargo test
