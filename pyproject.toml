[project]
name = "lunaris"
version = "0.1.0"
description = "分布式 WASM 执行器，Worker 无需公网 IP，支持源码直传与 7 种语言 Guest SDK"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiofiles>=24.1.0",
    "fastapi>=0.115.14",
    "loguru>=0.7.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "orjson>=3.11.3",
    "prometheus-client>=0.23.1",
    "protobuf>=6.33.6,<7",
    "psutil>=7.0.0",
    "uvicorn>=0.35.0",
    "uvloop>=0.21.0",
    "wasmtime>=36.0.0",
    "websockets>=15.0.1",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = ["lunaris/proto/*", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E721",   # type comparison (existing code)
    "N802",   # function name should be lowercase (Rest)
    "UP006",  # use type instead of Type
    "UP007",  # use X | Y for type annotations
    "UP022",  # use subprocess instead of os.popen
    "UP035",  # deprecated imports
    "UP045",  # use X | None
    "UP037",  # remove quotes from type annotation
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # allow re-exports and wildcard imports in __init__.py

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["lunaris*"]
