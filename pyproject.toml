[project]
name = "lunaris"
version = "0.1.0"
description = "分布式 WASM 执行器，Worker 无需公网 IP，支持源码直传与 7 种语言 Guest SDK"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiofiles>=24.1.0",
    "fastapi>=0.115.14",
    "loguru>=0.7.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "orjson>=3.11.3",
    "prometheus-client>=0.23.1",
    "protobuf>=6.33.6,<7",
    "psutil>=7.0.0",
    "uvicorn>=0.35.0",
    "uvloop>=0.21.0",
    "wasmtime>=36.0.0",
    "websockets>=15.0.1",
    "zstandard>=0.25.0",
]
